name: archon-smart-pr-review
description: |
  Use when: User wants a smart, efficient PR review that adapts to PR complexity.
  Triggers: "smart review", "review this PR", "review PR #123", "efficient review",
            "smart PR review", "quick review".
  Does: Gathers PR scope -> classifies cost/risk -> routes to only relevant review agents ->
        synthesizes findings -> auto-fixes CRITICAL/HIGH issues.
  NOT for: When you explicitly want ALL review agents (use archon-comprehensive-pr-review instead).

  Unlike the comprehensive review, this workflow classifies the PR first and runs the
  cheapest useful review set. A 3-line typo fix skips specialist agents entirely.

nodes:
  - id: scope
    command: archon-pr-review-scope
    effort: max
    modelReasoningEffort: xhigh

  - id: visual-audit-scope
    runtime: bun
    timeout: 10000
    depends_on: [scope]
    script: |
      import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
      import { dirname, resolve } from 'node:path';

      const artifactsDir = process.env.ARTIFACTS_DIR;
      if (!artifactsDir) {
        process.stderr.write('visual-audit-scope: ARTIFACTS_DIR is not set\n');
        process.exit(1);
      }

      const scopePath = resolve(artifactsDir, 'review', 'scope.md');
      const artifactPath = resolve(artifactsDir, 'review', 'visual-audit-scope.json');
      if (!existsSync(scopePath)) {
        process.stderr.write(`visual-audit-scope: missing scope manifest at ${scopePath}\n`);
        process.exit(1);
      }

      const pathExtRe = /\.(tsx|jsx|ts|js|css|scss|sass|html|vue|svelte)$/i;
      const loosePathRe =
        /(?:^|[\s|([>])((?:\.?\/)?(?:src|app|pages|components|styles|public|packages|apps)[A-Za-z0-9_./@+-]*\.(?:tsx|jsx|ts|js|css|scss|sass|html|vue|svelte)|index\.html)/gm;

      function normalizePath(value) {
        return String(value ?? '')
          .trim()
          .replace(/^['"`]+|['"`]+$/g, '')
          .replace(/[),.;:]+$/g, '')
          .replace(/\\/g, '/')
          .replace(/^\.\//, '');
      }

      function isPathLike(value) {
        return Boolean(value && !value.includes('://') && !value.includes('$') && !/\s/.test(value) && (value === 'index.html' || pathExtRe.test(value)));
      }

      function isUiFile(path) {
        const p = normalizePath(path);
        if (!isPathLike(p)) return false;
        if (/(^|\/)(__tests__|test|tests|spec|specs|fixtures|mocks|snapshots?)\//i.test(p)) return false;
        if (/\.(test|spec|stories)\.(tsx|jsx|ts|js)$/i.test(p)) return false;
        if (/\.d\.ts$/i.test(p) || /(^|\/)generated-osdk\.ts$/i.test(p) || /(^|\/)dist\//i.test(p)) return false;
        if (p === 'index.html' || p.endsWith('/index.html')) return true;
        if (/^src\/(main|App)\.(tsx|jsx)$/i.test(p)) return true;
        if (/^src\/(routes|pages|components|widgets)\//i.test(p) && /\.(tsx|jsx|css|scss|sass)$/i.test(p)) return true;
        if (/^src\/.*\.(css|scss|sass)$/i.test(p)) return true;
        if (/^(app|pages|components|styles)\//i.test(p) && /\.(tsx|jsx|css|scss|sass)$/i.test(p)) return true;
        return false;
      }

      const scopeText = readFileSync(scopePath, 'utf8');
      const candidates = new Set();
      for (const match of scopeText.matchAll(/`([^`\n]+)`/g)) {
        const path = normalizePath(match[1]);
        if (isPathLike(path)) candidates.add(path);
      }
      for (const match of scopeText.matchAll(loosePathRe)) {
        const path = normalizePath(match[1]);
        if (isPathLike(path)) candidates.add(path);
      }

      const candidateFiles = [...candidates].sort();
      const uiFiles = candidateFiles.filter(isUiFile);
      const result = {
        needs_visual_audit: uiFiles.length > 0 ? 'true' : 'false',
        evidence_required: uiFiles.length > 0 ? 'true' : 'false',
        ui_files: uiFiles,
        candidate_files: candidateFiles,
        source: '$ARTIFACTS_DIR/review/scope.md',
        reason:
          uiFiles.length > 0
            ? `UI files require screenshot/Playwright evidence: ${uiFiles.slice(0, 8).join(', ')}`
            : 'No user-visible UI file patterns detected in review scope.',
        artifact_path: artifactPath,
      };

      mkdirSync(dirname(artifactPath), { recursive: true });
      writeFileSync(artifactPath, `${JSON.stringify(result, null, 2)}\n`);
      console.log(JSON.stringify(result));

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [scope]
    effort: max
    modelReasoningEffort: xhigh

  - id: classify
    prompt: |
      Classify review spend for this PR using the cheapest safe reviewer set.
      Do not run tools. Use only the PR scope below.

      ## PR Scope
      $scope.output

      ## Risk Justification Rules
      Call a PR high risk only when you can name a concrete failure mode with
      meaningful blast radius. Size alone is not enough. Explain:
      - what can break
      - who or what is affected
      - whether the failure is hard to detect or hard to reverse
      - why extra reviewers are worth the token spend

      High-risk signals:
      - security, auth, secrets, permission, routing, or trust-boundary changes
      - payments, financial writes, irreversible external actions, or data loss
      - migrations, schema changes, persistence semantics, or rollback risk
      - concurrency, locking, daemon/runtime lifecycle, retries, or async failure paths
      - cross-repo/generated contracts, public API/CLI/env var changes, or compatibility risk
      - new subsystem architecture or broad refactor with unclear ownership
      - validation failed, validation missing for changed behavior, or uncertainty is high

      Low-risk signals:
      - docs-only, tests-only, copy-only, formatting, dependency metadata, or small mechanical ports
      - validation is green and the changed behavior is narrow and reversible
      - no trust boundary, persistence, contract, concurrency, or external side-effect change

      Review modes:
      - minimal: code review only
      - targeted: code review plus exactly one specialist
      - full: all specialists, only for high risk or explicit comprehensive/5-agent request

      Baseline rule:
      - Set run_code_review to "true" for every non-empty PR.
      - Never set all reviewer flags to "false".
      - For targeted mode, run code review plus exactly one specialist.
      - For full mode, run code review plus all specialists.

      Specialist choice:
      - error-handling: failure paths, retries, external services, async, concurrency, runtime
      - test-coverage: behavior changed and tests are the dominant uncertainty
      - comment-quality: comments/docstrings could mislead maintainers
      - docs-impact: public API, CLI, env var, command, contract, or user-facing behavior changed

      Return full only if the reasoning proves the extra spend is justified.
    provider: codex
    model: gpt-5.4-mini
    effort: low
    output_format:
      type: object
      properties:
        run_code_review:
          type: string
          enum: ["true", "false"]
        run_error_handling:
          type: string
          enum: ["true", "false"]
        run_test_coverage:
          type: string
          enum: ["true", "false"]
        run_comment_quality:
          type: string
          enum: ["true", "false"]
        run_docs_impact:
          type: string
          enum: ["true", "false"]
        review_mode:
          type: string
          enum: ["minimal", "targeted", "full"]
        risk_level:
          type: string
          enum: ["low", "medium", "high"]
        complexity:
          type: string
          enum: ["trivial", "small", "medium", "large"]
        dominant_risk:
          type: string
        reasoning:
          type: string
        skipped_agents_reason:
          type: string
      required:
        - run_code_review
        - run_error_handling
        - run_test_coverage
        - run_comment_quality
        - run_docs_impact
        - review_mode
        - risk_level
        - complexity
        - dominant_risk
        - reasoning
        - skipped_agents_reason
    depends_on: [scope]

  - id: review-routing
    runtime: bun
    timeout: 10000
    depends_on: [classify, visual-audit-scope]
    script: |
      const decision = $classify.output;
      const visualAudit = $visual-audit-scope.output;

      const specialistKeys = [
        'run_error_handling',
        'run_test_coverage',
        'run_comment_quality',
        'run_docs_impact',
      ];

      const validModes = new Set(['minimal', 'targeted', 'full']);
      const validRisks = new Set(['low', 'medium', 'high']);
      const validComplexities = new Set(['trivial', 'small', 'medium', 'large']);

      const asString = value => (typeof value === 'string' ? value : String(value ?? ''));
      const asBool = value => asString(value).toLowerCase() === 'true';
      const enabledSpecialists = specialistKeys.filter(key => asBool(decision[key]));
      const text = `${asString(decision.dominant_risk)} ${asString(decision.reasoning)}`.toLowerCase();

      let riskLevel = validRisks.has(decision.risk_level) ? decision.risk_level : 'medium';
      let reviewMode = validModes.has(decision.review_mode) ? decision.review_mode : null;

      if (reviewMode === null) {
        reviewMode = riskLevel === 'high' ? 'full' : enabledSpecialists.length > 0 ? 'targeted' : 'minimal';
      }

      if (riskLevel === 'high') {
        reviewMode = 'full';
      } else if (reviewMode === 'full') {
        reviewMode = 'targeted';
      }

      function pickSpecialist() {
        if (enabledSpecialists.length === 1) return enabledSpecialists[0];
        if (text.match(/error|exception|failure|retry|async|concurr|lock|runtime|daemon|service|external/)) {
          return 'run_error_handling';
        }
        if (text.match(/doc|api|cli|env|contract|command|user-facing|public/)) {
          return 'run_docs_impact';
        }
        if (text.match(/comment|docstring|jsdoc|maintainer/)) {
          return 'run_comment_quality';
        }
        if (enabledSpecialists.includes('run_test_coverage')) return 'run_test_coverage';
        return enabledSpecialists[0] ?? 'run_test_coverage';
      }

      const normalized = {
        run_code_review: 'true',
        run_error_handling: 'false',
        run_test_coverage: 'false',
        run_comment_quality: 'false',
        run_docs_impact: 'false',
        review_mode: reviewMode,
        risk_level: riskLevel,
        complexity: validComplexities.has(decision.complexity) ? decision.complexity : 'medium',
        dominant_risk: asString(decision.dominant_risk),
        reasoning: asString(decision.reasoning),
        skipped_agents_reason: asString(decision.skipped_agents_reason),
        classifier_review_mode: asString(decision.review_mode),
        classifier_risk_level: asString(decision.risk_level),
        needs_visual_audit: asString(visualAudit.needs_visual_audit),
        visual_audit_reason: asString(visualAudit.reason),
      };

      if (reviewMode === 'full') {
        for (const key of specialistKeys) normalized[key] = 'true';
      } else if (reviewMode === 'targeted') {
        normalized[pickSpecialist()] = 'true';
      }

      console.log(JSON.stringify(normalized));

  - id: code-review
    command: archon-code-review-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_code_review == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_error_handling == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_test_coverage == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_comment_quality == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_docs_impact == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    effort: max
    modelReasoningEffort: xhigh

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]

  # Optional: push notification when review completes.
  # To enable, create .archon/mcp/ntfy.json — see docs/mcp-servers.md
    effort: max
    modelReasoningEffort: xhigh
  - id: check-ntfy
    bash: "test -f .archon/mcp/ntfy.json && echo 'true' || echo 'false'"
    depends_on: [implement-fixes]

  - id: notify
    depends_on: [check-ntfy, synthesize, implement-fixes]
    when: "$check-ntfy.output == 'true'"
    trigger_rule: all_success
    mcp: .archon/mcp/ntfy.json
    allowed_tools: []
    prompt: |
      Send a push notification summarizing the PR review results.

      Review synthesis:
      $synthesize.output

      Fix results:
      $implement-fixes.output

      Send with:
      - title: "PR Review Complete"
      - message: 1-2 sentence summary — verdict and issue count. Short enough for a lock screen.
      - priority: 3 if ready to merge, 4 if needs fixes, 5 if critical issues remain
    effort: max
    modelReasoningEffort: xhigh
