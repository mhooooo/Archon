name: archon-smart-pr-review
description: |
  Use when: User wants a smart, efficient PR review that adapts to PR complexity.
  Triggers: "smart review", "review this PR", "review PR #123", "efficient review",
            "smart PR review", "quick review".
  Does: Gathers PR scope -> classifies cost/risk -> routes to only relevant review agents ->
        synthesizes findings -> auto-fixes CRITICAL/HIGH issues.
  NOT for: When you explicitly want ALL review agents (use archon-comprehensive-pr-review instead).

  Unlike the comprehensive review, this workflow classifies the PR first and runs the
  cheapest useful review set. A 3-line typo fix skips specialist agents entirely.

nodes:
  - id: scope
    command: archon-pr-review-scope
    effort: max
    modelReasoningEffort: xhigh

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [scope]
    effort: max
    modelReasoningEffort: xhigh

  - id: classify
    prompt: |
      Classify review spend for this PR using the cheapest safe reviewer set.
      Do not run tools. Use only the PR scope below.

      ## PR Scope
      $scope.output

      ## Risk Justification Rules
      Call a PR high risk only when you can name a concrete failure mode with
      meaningful blast radius. Size alone is not enough. Explain:
      - what can break
      - who or what is affected
      - whether the failure is hard to detect or hard to reverse
      - why extra reviewers are worth the token spend

      High-risk signals:
      - security, auth, secrets, permission, routing, or trust-boundary changes
      - payments, financial writes, irreversible external actions, or data loss
      - migrations, schema changes, persistence semantics, or rollback risk
      - concurrency, locking, daemon/runtime lifecycle, retries, or async failure paths
      - cross-repo/generated contracts, public API/CLI/env var changes, or compatibility risk
      - new subsystem architecture or broad refactor with unclear ownership
      - validation failed, validation missing for changed behavior, or uncertainty is high

      Low-risk signals:
      - docs-only, tests-only, copy-only, formatting, dependency metadata, or small mechanical ports
      - validation is green and the changed behavior is narrow and reversible
      - no trust boundary, persistence, contract, concurrency, or external side-effect change

      Review modes:
      - minimal: code review only
      - targeted: code review plus exactly one specialist
      - full: all specialists, only for high risk or explicit comprehensive/5-agent request

      Baseline rule:
      - Set run_code_review to "true" for every non-empty PR.
      - Never set all reviewer flags to "false".
      - For targeted mode, run code review plus exactly one specialist.
      - For full mode, run code review plus all specialists.

      Specialist choice:
      - error-handling: failure paths, retries, external services, async, concurrency, runtime
      - test-coverage: behavior changed and tests are the dominant uncertainty
      - comment-quality: comments/docstrings could mislead maintainers
      - docs-impact: public API, CLI, env var, command, contract, or user-facing behavior changed

      Return full only if the reasoning proves the extra spend is justified.
    provider: codex
    model: gpt-5.4-mini
    effort: low
    output_format:
      type: object
      properties:
        run_code_review:
          type: string
          enum: ["true", "false"]
        run_error_handling:
          type: string
          enum: ["true", "false"]
        run_test_coverage:
          type: string
          enum: ["true", "false"]
        run_comment_quality:
          type: string
          enum: ["true", "false"]
        run_docs_impact:
          type: string
          enum: ["true", "false"]
        review_mode:
          type: string
          enum: ["minimal", "targeted", "full"]
        risk_level:
          type: string
          enum: ["low", "medium", "high"]
        complexity:
          type: string
          enum: ["trivial", "small", "medium", "large"]
        dominant_risk:
          type: string
        reasoning:
          type: string
        skipped_agents_reason:
          type: string
      required:
        - run_code_review
        - run_error_handling
        - run_test_coverage
        - run_comment_quality
        - run_docs_impact
        - review_mode
        - risk_level
        - complexity
        - dominant_risk
        - reasoning
        - skipped_agents_reason
    depends_on: [scope]

  - id: code-review
    command: archon-code-review-agent
    depends_on: [classify, sync]
    when: "$classify.output.run_code_review == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [classify, sync]
    when: "$classify.output.run_error_handling == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [classify, sync]
    when: "$classify.output.run_test_coverage == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [classify, sync]
    when: "$classify.output.run_comment_quality == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [classify, sync]
    when: "$classify.output.run_docs_impact == 'true'"
    effort: max
    modelReasoningEffort: xhigh

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    effort: max
    modelReasoningEffort: xhigh

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]

  # Optional: push notification when review completes.
  # To enable, create .archon/mcp/ntfy.json — see docs/mcp-servers.md
    effort: max
    modelReasoningEffort: xhigh
  - id: check-ntfy
    bash: "test -f .archon/mcp/ntfy.json && echo 'true' || echo 'false'"
    depends_on: [implement-fixes]

  - id: notify
    depends_on: [check-ntfy, synthesize, implement-fixes]
    when: "$check-ntfy.output == 'true'"
    trigger_rule: all_success
    mcp: .archon/mcp/ntfy.json
    allowed_tools: []
    prompt: |
      Send a push notification summarizing the PR review results.

      Review synthesis:
      $synthesize.output

      Fix results:
      $implement-fixes.output

      Send with:
      - title: "PR Review Complete"
      - message: 1-2 sentence summary — verdict and issue count. Short enough for a lock screen.
      - priority: 3 if ready to merge, 4 if needs fixes, 5 if critical issues remain
    effort: max
    modelReasoningEffort: xhigh
