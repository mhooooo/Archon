name: archon-plan-to-pr
description: |
  Use when: You have an existing implementation plan and want to execute it end-to-end.
  Input: Path to a plan file ($ARTIFACTS_DIR/plan.md or .agents/plans/*.md)
  Output: PR ready for merge with budget-aware review completed

  Full workflow:
  1. Read plan, setup branch, extract scope limits
  2. Verify plan research is still valid
  3. Implement all tasks with type-checking
  4. Run full validation suite
  5. Create PR with template, mark ready
  6. Budget-aware code review (default targeted; full 5-agent fanout only for high-risk scope)
  7. Synthesize and fix review findings
  8. Final summary with decision matrix -> GitHub comment + follow-up recommendations

  NOT for: Creating plans from scratch (use archon-idea-to-pr), quick fixes, standalone reviews.

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: SETUP
  # ═══════════════════════════════════════════════════════════════════

  - id: plan-setup
    command: archon-plan-setup
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: CONFIRM PLAN
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: confirm-plan
    command: archon-confirm-plan
    depends_on: [plan-setup]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: implement-tasks
    command: archon-implement-tasks
    depends_on: [confirm-plan]
    context: fresh

  # Auto-commit any pending changes left by archon-implement-tasks.
  # The upstream skill prompt (.archon/commands/defaults/archon-implement-tasks.md)
  # has no commit step — its success criteria are TASKS_COMPLETE / TYPES_PASS /
  # TESTS_PASS / DEVIATIONS_DOCUMENTED / ARTIFACT_WRITTEN, with no
  # COMMITS_EXIST. Agents reliably write files and run tests but skip
  # `git commit`, leaving the branch empty and tripping implementation-gate.
  # This node closes that gap deterministically.
    effort: max
    modelReasoningEffort: xhigh
  - id: auto-commit
    bash: |
      # Stage everything except vault paths — vault writers (knowledge_compile,
      # live-indexer, drafter workflows) run inside the worktree's working copy
      # and write to mhoooo/Memory/. These auto-writes shouldn't ride into the
      # PR; they conflict with main's parallel writers (vault_backup race
      # gotcha — see moo-second-brain memory feedback_archon_worktree_writes_vault).
      git add -A -- ':!mhoooo/Memory/**'
      if git diff --cached --quiet; then
        echo "auto-commit: nothing to commit (clean tree, vault excluded)"
      else
        git commit -m "feat: archon-implement-tasks output (auto-committed)"
        echo "auto-commit: committed $(git rev-list --count "$BASE_BRANCH"..HEAD) total ahead of $BASE_BRANCH"
      fi
    depends_on: [implement-tasks]
    timeout: 30000

  # Fail fast if even after auto-commit there are zero commits ahead of
  # BASE_BRANCH — means implement-tasks left the worktree completely
  # untouched (a different upstream failure mode worth surfacing fast,
  # ~30s instead of ~15min through the validate / 5-agent-review cascade).
  - id: implementation-gate
    bash: |
      count=$(git rev-list --count "$BASE_BRANCH"..HEAD 2>/dev/null || echo 0)
      if [ "$count" -eq 0 ]; then
        echo "BLOCKED: zero commits on $(git branch --show-current) vs $BASE_BRANCH after auto-commit"
        echo "implement-tasks produced no file changes at all — see node logs."
        exit 1
      fi
      echo "OK: $count commit(s) ahead of $BASE_BRANCH"
    depends_on: [auto-commit]
    timeout: 30000


  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: VALIDATE
  # ═══════════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implementation-gate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINALIZE PR
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: finalize-pr
    command: archon-finalize-pr
    depends_on: [validate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 6: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [finalize-pr]

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [verify-pr-base]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: review-classify
    prompt: |
      Classify review spend for this PR using the cheapest safe reviewer set.
      Do not run tools. Use only the PR scope below.

      ## PR Scope
      $review-scope.output

      ## Risk Justification Rules
      Call a PR high risk only when you can name a concrete failure mode with
      meaningful blast radius. Size alone is not enough. Explain:
      - what can break
      - who or what is affected
      - whether the failure is hard to detect or hard to reverse
      - why extra reviewers are worth the token spend

      High-risk signals:
      - security, auth, secrets, permission, routing, or trust-boundary changes
      - payments, financial writes, irreversible external actions, or data loss
      - migrations, schema changes, persistence semantics, or rollback risk
      - concurrency, locking, daemon/runtime lifecycle, retries, or async failure paths
      - cross-repo/generated contracts, public API/CLI/env var changes, or compatibility risk
      - new subsystem architecture or broad refactor with unclear ownership
      - validation failed, validation missing for changed behavior, or uncertainty is high

      Low-risk signals:
      - docs-only, tests-only, copy-only, formatting, dependency metadata, or small mechanical ports
      - validation is green and the changed behavior is narrow and reversible
      - no trust boundary, persistence, contract, concurrency, or external side-effect change

      Review modes:
      - minimal: code review only
      - targeted: code review plus exactly one specialist
      - full: all specialists, only for high risk or explicit comprehensive/5-agent request

      Baseline rule:
      - Set run_code_review to "true" for every non-empty PR.
      - Never set all reviewer flags to "false".
      - For targeted mode, run code review plus exactly one specialist.
      - For full mode, run code review plus all specialists.

      Specialist choice:
      - error-handling: failure paths, retries, external services, async, concurrency, runtime
      - test-coverage: behavior changed and tests are the dominant uncertainty
      - comment-quality: comments/docstrings could mislead maintainers
      - docs-impact: public API, CLI, env var, command, contract, or user-facing behavior changed

      Return full only if the reasoning proves the extra spend is justified.
    provider: codex
    model: gpt-5.4-mini
    effort: low
    output_format:
      type: object
      properties:
        run_code_review:
          type: string
          enum: ["true", "false"]
        run_error_handling:
          type: string
          enum: ["true", "false"]
        run_test_coverage:
          type: string
          enum: ["true", "false"]
        run_comment_quality:
          type: string
          enum: ["true", "false"]
        run_docs_impact:
          type: string
          enum: ["true", "false"]
        review_mode:
          type: string
          enum: ["minimal", "targeted", "full"]
        risk_level:
          type: string
          enum: ["low", "medium", "high"]
        complexity:
          type: string
          enum: ["trivial", "small", "medium", "large"]
        dominant_risk:
          type: string
        reasoning:
          type: string
        skipped_agents_reason:
          type: string
      required:
        - run_code_review
        - run_error_handling
        - run_test_coverage
        - run_comment_quality
        - run_docs_impact
        - review_mode
        - risk_level
        - complexity
        - dominant_risk
        - reasoning
        - skipped_agents_reason
    depends_on: [review-scope]

  - id: review-routing
    runtime: bun
    timeout: 10000
    depends_on: [review-classify]
    script: |
      const decision = $review-classify.output;

      const specialistKeys = [
        'run_error_handling',
        'run_test_coverage',
        'run_comment_quality',
        'run_docs_impact',
      ];

      const validModes = new Set(['minimal', 'targeted', 'full']);
      const validRisks = new Set(['low', 'medium', 'high']);
      const validComplexities = new Set(['trivial', 'small', 'medium', 'large']);

      const asString = value => (typeof value === 'string' ? value : String(value ?? ''));
      const asBool = value => asString(value).toLowerCase() === 'true';
      const enabledSpecialists = specialistKeys.filter(key => asBool(decision[key]));
      const text = `${asString(decision.dominant_risk)} ${asString(decision.reasoning)}`.toLowerCase();

      let riskLevel = validRisks.has(decision.risk_level) ? decision.risk_level : 'medium';
      let reviewMode = validModes.has(decision.review_mode) ? decision.review_mode : null;

      if (reviewMode === null) {
        reviewMode = riskLevel === 'high' ? 'full' : enabledSpecialists.length > 0 ? 'targeted' : 'minimal';
      }

      if (riskLevel === 'high') {
        reviewMode = 'full';
      } else if (reviewMode === 'full') {
        reviewMode = 'targeted';
      }

      function pickSpecialist() {
        if (enabledSpecialists.length === 1) return enabledSpecialists[0];
        if (text.match(/error|exception|failure|retry|async|concurr|lock|runtime|daemon|service|external/)) {
          return 'run_error_handling';
        }
        if (text.match(/doc|api|cli|env|contract|command|user-facing|public/)) {
          return 'run_docs_impact';
        }
        if (text.match(/comment|docstring|jsdoc|maintainer/)) {
          return 'run_comment_quality';
        }
        if (enabledSpecialists.includes('run_test_coverage')) return 'run_test_coverage';
        return enabledSpecialists[0] ?? 'run_test_coverage';
      }

      const normalized = {
        run_code_review: 'true',
        run_error_handling: 'false',
        run_test_coverage: 'false',
        run_comment_quality: 'false',
        run_docs_impact: 'false',
        review_mode: reviewMode,
        risk_level: riskLevel,
        complexity: validComplexities.has(decision.complexity) ? decision.complexity : 'medium',
        dominant_risk: asString(decision.dominant_risk),
        reasoning: asString(decision.reasoning),
        skipped_agents_reason: asString(decision.skipped_agents_reason),
        classifier_review_mode: asString(decision.review_mode),
        classifier_risk_level: asString(decision.risk_level),
      };

      if (reviewMode === 'full') {
        for (const key of specialistKeys) normalized[key] = 'true';
      } else if (reviewMode === 'targeted') {
        normalized[pickSpecialist()] = 'true';
      }

      console.log(JSON.stringify(normalized));

  - id: code-review
    command: archon-code-review-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_code_review == 'true'"
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_error_handling == 'true'"
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_test_coverage == 'true'"
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_comment_quality == 'true'"
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [review-routing, sync]
    when: "$review-routing.output.run_docs_impact == 'true'"
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: one_success
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 7: FIX REVIEW ISSUES
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 8: FINAL SUMMARY & FOLLOW-UP
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: workflow-summary
    command: archon-workflow-summary
    depends_on: [implement-fixes]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh
