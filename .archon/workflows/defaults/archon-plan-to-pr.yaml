name: archon-plan-to-pr
description: |
  Use when: You have an existing implementation plan and want to execute it end-to-end.
  Input: Path to a plan file ($ARTIFACTS_DIR/plan.md or .agents/plans/*.md)
  Output: PR ready for merge with comprehensive review completed

  Full workflow:
  1. Read plan, setup branch, extract scope limits
  2. Verify plan research is still valid
  3. Implement all tasks with type-checking
  4. Run full validation suite
  5. Create PR with template, mark ready
  6. Comprehensive code review (5 parallel agents with scope limit awareness)
  7. Synthesize and fix review findings
  8. Final summary with decision matrix -> GitHub comment + follow-up recommendations

  NOT for: Creating plans from scratch (use archon-idea-to-pr), quick fixes, standalone reviews.

nodes:
  # ═══════════════════════════════════════════════════════════════════
  # PHASE 1: SETUP
  # ═══════════════════════════════════════════════════════════════════

  - id: plan-setup
    command: archon-plan-setup
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 2: CONFIRM PLAN
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: confirm-plan
    command: archon-confirm-plan
    depends_on: [plan-setup]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 3: IMPLEMENT
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: implement-tasks
    command: archon-implement-tasks
    depends_on: [confirm-plan]
    context: fresh

  # Auto-commit any pending changes left by archon-implement-tasks.
  # The upstream skill prompt (.archon/commands/defaults/archon-implement-tasks.md)
  # has no commit step — its success criteria are TASKS_COMPLETE / TYPES_PASS /
  # TESTS_PASS / DEVIATIONS_DOCUMENTED / ARTIFACT_WRITTEN, with no
  # COMMITS_EXIST. Agents reliably write files and run tests but skip
  # `git commit`, leaving the branch empty and tripping implementation-gate.
  # This node closes that gap deterministically.
    effort: max
    modelReasoningEffort: xhigh
  - id: auto-commit
    bash: |
      # Stage everything except vault paths — vault writers (knowledge_compile,
      # live-indexer, drafter workflows) run inside the worktree's working copy
      # and write to mhoooo/Memory/. These auto-writes shouldn't ride into the
      # PR; they conflict with main's parallel writers (vault_backup race
      # gotcha — see moo-second-brain memory feedback_archon_worktree_writes_vault).
      git add -A -- ':!mhoooo/Memory/**'
      if git diff --cached --quiet; then
        echo "auto-commit: nothing to commit (clean tree, vault excluded)"
      else
        git commit -m "feat: archon-implement-tasks output (auto-committed)"
        echo "auto-commit: committed $(git rev-list --count "$BASE_BRANCH"..HEAD) total ahead of $BASE_BRANCH"
      fi
    depends_on: [implement-tasks]
    timeout: 30000

  # Fail fast if even after auto-commit there are zero commits ahead of
  # BASE_BRANCH — means implement-tasks left the worktree completely
  # untouched (a different upstream failure mode worth surfacing fast,
  # ~30s instead of ~15min through the validate / 5-agent-review cascade).
  - id: implementation-gate
    bash: |
      count=$(git rev-list --count "$BASE_BRANCH"..HEAD 2>/dev/null || echo 0)
      if [ "$count" -eq 0 ]; then
        echo "BLOCKED: zero commits on $(git branch --show-current) vs $BASE_BRANCH after auto-commit"
        echo "implement-tasks produced no file changes at all — see node logs."
        exit 1
      fi
      echo "OK: $count commit(s) ahead of $BASE_BRANCH"
    depends_on: [auto-commit]
    timeout: 30000


  # ═══════════════════════════════════════════════════════════════════
  # PHASE 4: VALIDATE
  # ═══════════════════════════════════════════════════════════════════

  - id: validate
    command: archon-validate
    depends_on: [implementation-gate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 5: FINALIZE PR
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: finalize-pr
    command: archon-finalize-pr
    depends_on: [validate]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 6: CODE REVIEW
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: verify-pr-base
    bash: |
      set -euo pipefail
      EXPECTED="$BASE_BRANCH"
      ACTUAL=$(gh pr view --json baseRefName -q '.baseRefName')
      if [ "$ACTUAL" != "$EXPECTED" ]; then
        PR_NUMBER=$(gh pr view --json number -q '.number')
        echo "Base mismatch on PR #$PR_NUMBER: expected=$EXPECTED actual=$ACTUAL — re-targeting" >&2
        gh pr edit "$PR_NUMBER" --base "$EXPECTED"
      else
        echo "PR base verified: $EXPECTED"
      fi
    depends_on: [finalize-pr]

  - id: review-scope
    command: archon-pr-review-scope
    depends_on: [verify-pr-base]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: visual-audit-scope
    runtime: bun
    timeout: 10000
    depends_on: [review-scope]
    script: |
      import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
      import { dirname, resolve } from 'node:path';

      const artifactsDir = '$ARTIFACTS_DIR';
      if (!artifactsDir || artifactsDir === '$' + 'ARTIFACTS_DIR') {
        process.stderr.write('visual-audit-scope: ARTIFACTS_DIR interpolation failed\n');
        process.exit(1);
      }

      const scopePath = resolve(artifactsDir, 'review', 'scope.md');
      const artifactPath = resolve(artifactsDir, 'review', 'visual-audit-scope.json');
      if (!existsSync(scopePath)) {
        process.stderr.write(`visual-audit-scope: missing scope manifest at ${scopePath}\n`);
        process.exit(1);
      }

      const pathExtRe = /\.(tsx|jsx|ts|js|css|scss|sass|html|vue|svelte)$/i;
      const loosePathRe =
        /(?:^|[\s|([>])((?:\.?\/)?(?:src|app|pages|components|styles|public|packages|apps)[A-Za-z0-9_./@+-]*\.(?:tsx|jsx|ts|js|css|scss|sass|html|vue|svelte)|index\.html)/gm;

      function normalizePath(value) {
        return String(value ?? '')
          .trim()
          .replace(/^['"`]+|['"`]+$/g, '')
          .replace(/[),.;:]+$/g, '')
          .replace(/\\/g, '/')
          .replace(/^\.\//, '');
      }

      function isPathLike(value) {
        return Boolean(value && !value.includes('://') && !value.includes('$') && !/\s/.test(value) && (value === 'index.html' || pathExtRe.test(value)));
      }

      function isUiFile(path) {
        const p = normalizePath(path);
        if (!isPathLike(p)) return false;
        if (/(^|\/)(__tests__|test|tests|spec|specs|fixtures|mocks|snapshots?)\//i.test(p)) return false;
        if (/\.(test|spec|stories)\.(tsx|jsx|ts|js)$/i.test(p)) return false;
        if (/\.d\.ts$/i.test(p) || /(^|\/)generated-osdk\.ts$/i.test(p) || /(^|\/)dist\//i.test(p)) return false;
        if (p === 'index.html' || p.endsWith('/index.html')) return true;
        if (/^src\/(main|App)\.(tsx|jsx)$/i.test(p)) return true;
        if (/^src\/(routes|pages|components|widgets)\//i.test(p) && /\.(tsx|jsx|css|scss|sass)$/i.test(p)) return true;
        if (/^src\/.*\.(css|scss|sass)$/i.test(p)) return true;
        if (/^(app|pages|components|styles)\//i.test(p) && /\.(tsx|jsx|css|scss|sass)$/i.test(p)) return true;
        return false;
      }

      const scopeText = readFileSync(scopePath, 'utf8');
      const candidates = new Set();
      for (const match of scopeText.matchAll(/`([^`\n]+)`/g)) {
        const path = normalizePath(match[1]);
        if (isPathLike(path)) candidates.add(path);
      }
      for (const match of scopeText.matchAll(loosePathRe)) {
        const path = normalizePath(match[1]);
        if (isPathLike(path)) candidates.add(path);
      }

      const candidateFiles = [...candidates].sort();
      const uiFiles = candidateFiles.filter(isUiFile);
      const result = {
        needs_visual_audit: uiFiles.length > 0 ? 'true' : 'false',
        evidence_required: uiFiles.length > 0 ? 'true' : 'false',
        ui_files: uiFiles,
        candidate_files: candidateFiles,
        source: '$ARTIFACTS_DIR/review/scope.md',
        reason:
          uiFiles.length > 0
            ? `UI files require screenshot/Playwright evidence: ${uiFiles.slice(0, 8).join(', ')}`
            : 'No user-visible UI file patterns detected in review scope.',
        artifact_path: artifactPath,
      };

      mkdirSync(dirname(artifactPath), { recursive: true });
      writeFileSync(artifactPath, `${JSON.stringify(result, null, 2)}\n`);
      console.log(JSON.stringify(result));

  - id: sync
    command: archon-sync-pr-with-main
    depends_on: [review-scope]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: code-review
    command: archon-code-review-agent
    depends_on: [visual-audit-scope, sync]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: error-handling
    command: archon-error-handling-agent
    depends_on: [sync]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: test-coverage
    command: archon-test-coverage-agent
    depends_on: [sync]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: comment-quality
    command: archon-comment-quality-agent
    depends_on: [sync]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: docs-impact
    command: archon-docs-impact-agent
    depends_on: [sync]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh

  - id: synthesize
    command: archon-synthesize-review
    depends_on: [code-review, error-handling, test-coverage, comment-quality, docs-impact]
    trigger_rule: all_done
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 7: FIX REVIEW ISSUES
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: implement-fixes
    command: archon-implement-review-fixes
    depends_on: [synthesize]
    context: fresh

  # ═══════════════════════════════════════════════════════════════════
  # PHASE 8: FINAL SUMMARY & FOLLOW-UP
  # ═══════════════════════════════════════════════════════════════════
    effort: max
    modelReasoningEffort: xhigh

  - id: workflow-summary
    command: archon-workflow-summary
    depends_on: [implement-fixes]
    context: fresh
    effort: max
    modelReasoningEffort: xhigh
